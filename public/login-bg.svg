<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011812" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="aura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGlow)" />

  <!-- Sacred Geometric Vitality Mandala (Subtle Rings) -->
  <g opacity="0.18" stroke="#34D399" fill="none">
    <circle cx="400" cy="460" r="320" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="400" cy="460" r="240" stroke-width="2" />
    <circle cx="400" cy="460" r="160" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="400" cy="460" r="80" stroke-width="1" />
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="400" cy="460" r="140" fill="#047857" opacity="0.45" filter="url(#aura)" />
  <circle cx="400" cy="460" r="70" fill="#F59E0B" opacity="0.3" filter="url(#aura)" />

  <!-- Large Central Ojas Emblem -->
  <g transform="translate(260, 290) scale(4.5)">
    <!-- Main Drop Body -->
    <path d="M32 4 C32 4 10 26 10 40 C10 52 20 62 32 62 C44 62 54 52 54 40 C54 26 32 4 32 4Z" 
          fill="url(#leafGrad)" />
    
    <!-- Inner Shadow -->
    <path d="M32 10 C32 10 16 28 16 40 C16 48 23 55 32 55 C41 55 48 48 48 40 C48 28 32 10 32 10Z" 
          fill="#022C22" opacity="0.4" />

    <!-- Left Sprout Leaf -->
    <path d="M32 48 C24 43 20 35 23 28 C27 26 33 30 32 39 Z" 
          fill="#34D399" />

    <!-- Right Sprout Leaf -->
    <path d="M32 48 C38 41 41 33 36 24 C33 24 29 30 32 38 Z" 
          fill="#6EE7B7" />

    <!-- Radiant Turmeric Essence Core -->
    <circle cx="32" cy="38" r="6" fill="url(#goldGrad)" />
    <circle cx="32" cy="38" r="3" fill="#FFFBEB" />
  </g>

  <!-- Branding Typography -->
  <text x="400" y="680" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="2px" 
        fill="#FFFFFF" 
        text-anchor="middle">
    OJAS
  </text>

  <text x="400" y="720" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="6px" 
        fill="#34D399" 
        text-anchor="middle">
    YOUR EVERYDAY NUTRITION COMPANION
  </text>

  <text x="400" y="755" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="13" 
        font-weight="400" 
        fill="#A7F3D0" 
        opacity="0.8" 
        text-anchor="middle">
    Ayurvedic Vitality • Precision Calorie Intelligence • Mindful Meal Planning
  </text>
</svg>
