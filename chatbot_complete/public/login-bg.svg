<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Gradients -->
    <radialGradient id="loginBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="45%" stop-color="#044E39" />
      <stop offset="80%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011B15" />
    </radialGradient>

    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Leaf Gradients -->
    <linearGradient id="vibrantDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="brightMintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="goldCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="900" height="1100" fill="url(#loginBg)" />

  <!-- Ambient Light Halo Behind Emblem -->
  <circle cx="450" cy="480" r="320" fill="url(#emeraldAura)" />
  <circle cx="450" cy="480" r="160" fill="url(#goldAura)" />

  <!-- Sacred Geometry Mandala Rings (Bright, Crisp, Visible) -->
  <g stroke="#34D399" fill="none">
    <circle cx="450" cy="480" r="340" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.45" />
    <circle cx="450" cy="480" r="280" stroke-width="2" opacity="0.6" />
    <circle cx="450" cy="480" r="210" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5" />
    <circle cx="450" cy="480" r="140" stroke-width="2" opacity="0.5" />
    
    <!-- 8 Radiant Star/Vitality Rays -->
    <g opacity="0.35" stroke-width="1.5">
      <line x1="450" y1="140" x2="450" y2="200" />
      <line x1="450" y1="760" x2="450" y2="820" />
      <line x1="110" y1="480" x2="170" y2="480" />
      <line x1="730" y1="480" x2="790" y2="480" />
      <line x1="210" y1="240" x2="252" y2="282" />
      <line x1="690" y1="240" x2="648" y2="282" />
      <line x1="210" y1="720" x2="252" y2="678" />
      <line x1="690" y1="720" x2="648" y2="678" />
    </g>

    <!-- Subtle Mandala Dots -->
    <g fill="#34D399" opacity="0.6">
      <circle cx="450" cy="200" r="4" />
      <circle cx="450" cy="760" r="4" />
      <circle cx="170" cy="480" r="4" />
      <circle cx="730" cy="480" r="4" />
      <circle cx="252" cy="282" r="3.5" />
      <circle cx="648" cy="282" r="3.5" />
      <circle cx="252" cy="678" r="3.5" />
      <circle cx="648" cy="678" r="3.5" />
    </g>
  </g>

  <!-- Large Central Ojas Vibrant Emblem (Crisp, High-Contrast) -->
  <g transform="translate(305, 300) scale(4.5)" filter="url(#softShadow)">
    <!-- Outer Vessel Teardrop -->
    <path d="M32 4 C32 4 10 26 10 40 C10 52 20 62 32 62 C44 62 54 52 54 40 C54 26 32 4 32 4Z" 
          fill="url(#vibrantDrop)" 
          stroke="#6EE7B7" 
          stroke-width="0.8" />
    
    <!-- Luminous Inner Emerald Arch -->
    <path d="M32 9 C32 9 15 28 15 40 C15 49 22 56 32 56 C42 56 49 49 49 40 C49 28 32 9 32 9Z" 
          fill="#064E3B" 
          opacity="0.55" />

    <!-- Left Sprout Leaf (Bright Mint) -->
    <path d="M32 48 C24 43 19 34 22 26 C27 24 33 29 32 39 Z" 
          fill="url(#brightMintGrad)" />

    <!-- Right Sprout Leaf (Radiant Mint) -->
    <path d="M32 48 C39 41 43 32 38 23 C34 23 29 29 32 38 Z" 
          fill="#A7F3D0" />

    <!-- Radiant Turmeric Essence Core (Warm Gold Halo) -->
    <circle cx="32" cy="37" r="7.5" fill="url(#goldCoreGrad)" filter="url(#glow)" />
    <circle cx="32" cy="37" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography (Bold, Bright, High Contrast) -->
  <g text-anchor="middle">
    <text x="450" y="730" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="4px" 
          fill="#FFFFFF">
      OJAS
    </text>

    <!-- Glowing Mint Subtitle -->
    <text x="450" y="775" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="15" 
          font-weight="700" 
          letter-spacing="6px" 
          fill="#34D399">
      YOUR EVERYDAY NUTRITION COMPANION
    </text>

    <!-- Accent Turmeric Dot Line -->
    <g fill="#F59E0B">
      <circle cx="350" cy="805" r="3" />
      <line x1="365" y1="805" x2="435" y2="805" stroke="#F59E0B" stroke-width="1" opacity="0.6" />
      <circle cx="450" cy="805" r="4" fill="#FBBF24" />
      <line x1="465" y1="805" x2="535" y2="805" stroke="#F59E0B" stroke-width="1" opacity="0.6" />
      <circle cx="550" cy="805" r="3" />
    </g>

    <!-- Feature Description -->
    <text x="450" y="840" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="14" 
          font-weight="500" 
          letter-spacing="1px" 
          fill="#D1FAE5" 
          opacity="0.95">
      Ayurvedic Vitality • Precision Calorie Intelligence • Mindful Meal Planning
    </text>
  </g>
</svg>
